# HTML
# Archive your static HTML project and save it with the build record.

trigger:
- main

# 🔴 CHANGED: Use self-hosted agent instead of Microsoft-hosted
pool:
  name: Self-Hosted

steps:
- checkout: self

- task: ArchiveFiles@2
  displayName: 'Archive source files'
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/html-build.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish HTML Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'html-artifact'
